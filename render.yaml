# Blueprint de Render: sitio estático (React + Vite).
# Las variables con sync:false se piden en el panel de Render (no van en el repositorio).
services:
  - type: web
    name: cucugoyo-store
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # Permite entrar directo a /cartas, /paquetes, /admin/login, etc.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
